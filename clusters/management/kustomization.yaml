apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied by the root Flux Kustomization `management`
# (stacks/flux-bootstrap/main.tf). ESO is tofu-owned (stacks/pki,
# ADR-033) and installed before Flux bootstraps, so the
# ClusterSecretStore in external-secrets/flux-config applies without
# dry-run failures.
resources:
  - ../../stacks/external-secrets/flux-config   # ClusterSecretStore (depends on ESO CRD)
  - ../../stacks/cni/flux
  - ../../stacks/monitoring/flux
  - ../../stacks/pki/flux
  - ../../stacks/identity/flux
  - ../../stacks/security/flux
  - ../../stacks/storage/flux
  # OpenClarity install is a two-phase Flux Kustomization (eso → HR) that
  # gates the chart on the ExternalSecret pipeline reaching Ready. The two
  # Kustomization CRs declared in security-openclarity.yaml each point at
  # their own sub-folder under stacks/security/ (flux-openclarity-eso/ and
  # flux-openclarity/) — they are NOT sub-resources of this kustomization.
  - security-openclarity.yaml
  # Same two-phase split for Harbor (postmortem 2026-04-29 #15).
  # storage-harbor-eso → storage-harbor — see file header for rationale.
  - storage-harbor.yaml
  # Two-phase monitoring: vm-k8s-stack HR (phase 1) → VMRule flux-alerts
  # (phase 2) — replaces the CRD-count-gated tofu manifest (hanoi #6).
  - monitoring-vm.yaml
  # Bug #41 (postmortem 2026-04-29) — Kyverno HR + ClusterPolicies split.
  # security-kyverno (HR) → security-kyverno-policies (ClusterPolicy +
  # cosign ExternalSecret). Same chicken/egg fix as the two above.
  - security-kyverno.yaml
