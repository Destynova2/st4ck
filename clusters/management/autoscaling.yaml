apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: autoscaling
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  dependsOn:
    - name: monitoring-vm-stack
  sourceRef:
    kind: GitRepository
    name: management
  path: ./stacks/autoscaling/flux
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-versions
