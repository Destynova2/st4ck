# Platform version registry — SINGLE SOURCE OF TRUTH for chart and
# provider version pins (ADR-033 ownership boundary, ADR-034 staging).
# Consumers:
#   - OpenTofu stacks: yamldecode(file(...)).data (local.platform_versions)
#   - Flux: postBuild.substituteFrom on the root Kustomization
#     (stacks/flux-bootstrap/main.tf) — ${key} placeholders in
#     HelmRelease/OCIRepository manifests resolve against this map.
#   - scripts/hauler-manifest-gen.py (artifact staging, ADR-034)
# Day-1 the ConfigMap is applied by tofu (flux-bootstrap stack); day-2
# Flux reconciles it from git like any other manifest.
