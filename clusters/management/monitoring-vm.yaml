---
# Two-phase monitoring split — same pattern as security-kyverno.yaml,
# security-openclarity.yaml and storage-harbor.yaml (postmortem Bug #41):
# a CR whose CRD is installed by a HelmRelease cannot live in the same
# Kustomization (server-side dry-run aborts the whole Kustomization).
#
#   Phase 1 — monitoring-vm-stack applies the vm-k8s-stack HelmRelease
#     with `wait: true`, blocking Ready until the chart is installed
#     (operator.victoriametrics.com CRDs registered, operator live).
#   Phase 2 — monitoring-flux-alerts applies the VMRule flux-alerts,
#     gated on phase 1 via dependsOn.
#
# Replaces the CRD-count-gated kubectl_manifest in
# stacks/monitoring/main.tf, which silently skipped the VMRule on every
# fresh cluster (count=0 at first apply, never re-run — hanoi #6).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-vm-stack
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: management
    namespace: flux-system
  path: ./stacks/monitoring/flux-vm
  prune: true
  wait: true
  timeout: 10m
  # postBuild is NOT inherited from the root `management`
  # Kustomization — each child needs its own substituteFrom
  # for the ${x_version} pins (platform version registry).
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-versions

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-flux-alerts
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  dependsOn:
    - name: monitoring-vm-stack
  sourceRef:
    kind: GitRepository
    name: management
    namespace: flux-system
  path: ./stacks/monitoring/flux-alerts
  prune: true
  wait: true
  timeout: 5m
  # postBuild is NOT inherited from the root `management`
  # Kustomization — each child needs its own substituteFrom
  # for the ${x_version} pins (platform version registry).
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-versions
