apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-infra
  namespace: secrets
spec:
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: openbao
      version: "${openbao_version}"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: openbao-infra-values
      valuesKey: values.yaml
      optional: false
