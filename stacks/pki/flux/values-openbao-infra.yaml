# OpenBao Infra — PKI backend + infrastructure secrets
# HA mode with Raft storage (3 replicas) + static seal + TLS
# Tofu appends bootstrap-openbao-infra.hcl only for the single-node phase.

global:
  tlsDisable: false

server:
  dev:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    # PDB: the chart owns it (single owner — golden-path finding
    # 2026-07-16: a standalone Flux PDB SSA-merged onto the chart's one
    # → "minAvailable and maxUnavailable cannot be both set"). And the
    # chart's unset default rendered maxUnavailable: 0, which blocks
    # EVERY voluntary drain (talosctl upgrade would hang). 1 of 3 ≡
    # minAvailable 2 — Raft quorum survives, drains proceed.
    disruptionBudget:
      enabled: true
      maxUnavailable: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/openbao/userconfig/openbao-infra-tls/tls.crt"
          tls_key_file    = "/openbao/userconfig/openbao-infra-tls/tls.key"
        }

        storage "raft" {
          path = "/openbao/data"

          # retry_join: pods 1+2 wait until pod-0 is the active leader,
          # then auto-join its Raft cluster. Without this each pod
          # initializes its own 1-node Raft cluster (= no HA, service
          # round-robin sends requests to empty followers). Discovered
          # postmortem 2026-04-26 — pods 1+2 had empty KV + missing
          # auth/kubernetes role, breaking cert-manager + ESO randomly.
          # leader_tls_servername MUST match a SAN on openbao-infra-tls.
          retry_join {
            leader_api_addr       = "https://openbao-infra-0.openbao-infra-internal:8200"
            leader_tls_servername = "openbao-infra"
            leader_ca_cert_file   = "/openbao/userconfig/openbao-infra-tls/ca.crt"
          }
          retry_join {
            leader_api_addr       = "https://openbao-infra-1.openbao-infra-internal:8200"
            leader_tls_servername = "openbao-infra"
            leader_ca_cert_file   = "/openbao/userconfig/openbao-infra-tls/ca.crt"
          }
          retry_join {
            leader_api_addr       = "https://openbao-infra-2.openbao-infra-internal:8200"
            leader_tls_servername = "openbao-infra"
            leader_ca_cert_file   = "/openbao/userconfig/openbao-infra-tls/ca.crt"
          }
        }

        service_registration "kubernetes" {}

        seal "static" {
          current_key_id = "infra-1"
          current_key    = "env://BAO_SEAL_KEY"
        }

        # Initialization is appended only during the single-node bootstrap phase.

  extraSecretEnvironmentVars:
    - envName: BAO_SEAL_KEY
      secretName: openbao-seal-key
      secretKey: key
    - envName: BAO_ADMIN_PASSWORD
      secretName: openbao-admin-password
      secretKey: password

  extraVolumes:
    - type: secret
      name: openbao-infra-tls

  dataStorage:
    enabled: true
    size: 1Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi

injector:
  enabled: true
  replicas: 1
  agentImage:
    registry: "quay.io"
    repository: "openbao/openbao"
  agentDefaults:
    cpuRequest: "50m"
    cpuLimit: "250m"
    memRequest: "64Mi"
    memLimit: "128Mi"
  webhook:
    failurePolicy: Ignore

csi:
  enabled: false

ui:
  enabled: true
