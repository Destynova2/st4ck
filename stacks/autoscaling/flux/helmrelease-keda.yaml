apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: autoscaling
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: keda
      version: "${keda_version}"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: keda-values
      valuesKey: values.yaml
      optional: false
