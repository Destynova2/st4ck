apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter-scaleway
  namespace: autoscaling
spec:
  suspend: true
  interval: 10m
  chart:
    spec:
      chart: ./karpenter-provider-scaleway/charts/karpenter-scaleway
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: management
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    credentialsSecret: karpenter-scaleway-credentials
    bootstrapSecrets: [karpenter-talos-worker]
    controller:
      enabled: false
