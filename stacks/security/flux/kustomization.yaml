apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# See stacks/cni/flux/kustomization.yaml for the configMapGenerator pattern
# rationale (single source of truth for tofu + Flux).
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease-trivy.yaml
  - helmrelease-tetragon.yaml
  # Phase 1b-5: scan workload isolation (PriorityClass + ResourceQuota).
  # Postmortem 2026-04-27 — Trivy OOM on grafana scan + lack of cap on
  # aggregate scan footprint. Belt-and-suspenders alongside per-job
  # memory limits in values-trivy.yaml.
  - scan-isolation.yaml
  #
  # Bug #41 (postmortem 2026-04-29) — Kyverno HelmRelease + its
  # ClusterPolicies split into
  #   ../flux-kyverno/             (HelmRelease + values configmap)
  #   ../flux-kyverno-policies/    (ClusterPolicy + cosign ExternalSecret)
  # wired by clusters/management/security-kyverno.yaml as two Flux
  # Kustomizations (security-kyverno-policies dependsOn security-kyverno).
  # Why split: server-side dry-run of the ClusterPolicy fails until the
  # Kyverno chart has installed its CRDs — fixed with a
  # Kustomization-level dependsOn.
configMapGenerator:
  - name: trivy-values
    namespace: security
    files:
      - values.yaml=values-trivy.yaml
  - name: tetragon-values
    namespace: security
    files:
      - values.yaml=values-tetragon.yaml
generatorOptions:
  disableNameSuffixHash: true
