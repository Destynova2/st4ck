# ESO creates grafana-admin from day 1. Tofu only seeds OpenBao;
# Merge would report SecretMissing without creating the target.
#
# Target name `grafana-admin` is intentionally distinct from the
# `grafana` Secret the chart auto-generates when no `existingSecret` is
# set — keeps ownership unambiguous (chart owns nothing, ESO owns
# grafana-admin).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-infra
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
