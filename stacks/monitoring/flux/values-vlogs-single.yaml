# VictoriaLogs Single — log storage (replaces Loki)
# Chart: victoria-logs-single from https://victoriametrics.github.io/helm-charts

server:
  fullnameOverride: "vlogs"
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # 512Mi OOMKilled (exit 137) after ~13h of full-stack ingestion on
      # the 5-node local E2E (2026-07-16) — same latent-prod class as
      # the vmagent OOM fixed the same day.
      memory: 1Gi
  extraArgs:
    envflag.enable: "true"
    envflag.prefix: VM_
    retentionPeriod: 30d
