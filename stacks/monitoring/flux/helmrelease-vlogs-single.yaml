apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-single
      # Pin resolved from clusters/management/versions-configmap.yaml
      # via postBuild.substituteFrom on the root Kustomization.
      version: "${victoria_logs_version}"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: vlogs-single-values
      valuesKey: values.yaml
      optional: false
