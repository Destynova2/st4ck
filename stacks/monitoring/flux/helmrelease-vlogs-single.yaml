apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-logs-single
      # Pin resolved from clusters/management/versions-configmap.yaml
      # via postBuild.substituteFrom on the root Kustomization.
      version: "${victoria_logs_version}"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: vlogs-single-values
      valuesKey: values.yaml
      optional: false
