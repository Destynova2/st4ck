apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
  namespace: monitoring
spec:
  # Niveau spec = couvre install ET upgrade (le run 10 a echoue sur
  # "upgrade action with timeout of 5m0s" alors que install: avait 15m).
  # DaemonSet x N noeuds froids : pulls serialises > 5 min.
  timeout: 15m
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: victoria-logs
  chart:
    spec:
      chart: victoria-logs-collector
      # Pin resolved from clusters/management/versions-configmap.yaml
      # via postBuild.substituteFrom on the root Kustomization.
      version: "${victoria_logs_collector_version}"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: vlogs-collector-values
      valuesKey: values.yaml
      optional: false
