apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
  namespace: storage
spec:
  # Short refresh during the bootstrap window so day-1 is reliable; the
  # storage-zot Kustomization's dependsOn releases the HelmRelease once
  # this ES reports Ready.
  refreshInterval: 30s
  secretStoreRef:
    name: openbao-infra
    kind: ClusterSecretStore
  target:
    # Name is imposed by the zot chart: mountSecret mounts
    # $RELEASE-secret (release: zot) at /secret.
    name: zot-secret
  data:
    # htpasswd line pre-composed at seed time (tofu bcrypt, pki stack):
    # secret/storage/zot = { admin_password, htpasswd }.
    - secretKey: htpasswd
      remoteRef:
        key: storage/zot
        property: htpasswd
