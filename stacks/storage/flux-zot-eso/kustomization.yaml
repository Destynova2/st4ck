apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Phase 1 of the two-phase zot split (Fix #7 pattern): the ExternalSecret
# renders zot-secret (htpasswd) from OpenBao BEFORE the HelmRelease in
# ../flux-zot/ mounts it. Simpler than the retired Harbor pipeline: the
# S3 credentials (zot-s3-credentials) come straight from the
# garage_buckets_keys terraform_data — no PushSecret mirror needed.
namespace: storage
resources:
  - external-secret-zot.yaml
