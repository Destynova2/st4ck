# Velero — backup & disaster recovery
# Backend: Garage S3 (in-cluster)

initContainers:
  - name: velero-plugin-for-aws
    # Velero 1.17.x requires AWS plugin 1.13.x (checked by verify-gitops.py).
    image: velero/velero-plugin-for-aws:v1.13.2
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      # Flux substitutes these values through the storage Kustomization.
      bucket: ${velero_bucket}
      config:
        region: garage
        s3ForcePathStyle: "true"
        s3Url: ${s3_url}

  volumeSnapshotLocation: []

credentials:
  useSecret: true
  existingSecret: velero-s3-credentials

# bitnamilegacy/kubectl has no K8s 1.35 tag — skip CRD upgrade job
upgradeCRDs: false

deployNodeAgent: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
