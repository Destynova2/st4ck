apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Velero is applied after Garage's bootstrap Job produces its credentials.
# Garage and zot have separate dependency graphs (ADR-043).
resources:
  - helmrepository.yaml
  - helmrelease-velero.yaml
configMapGenerator:
  - name: velero-values
    namespace: storage
    files:
      - values.yaml=values-velero.yaml
generatorOptions:
  disableNameSuffixHash: true
