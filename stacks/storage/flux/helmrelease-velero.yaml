apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: storage
spec:
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: garage
      namespace: garage
  chart:
    spec:
      chart: velero
      version: "${velero_version}"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: velero-values
      valuesKey: values.yaml
      optional: false
