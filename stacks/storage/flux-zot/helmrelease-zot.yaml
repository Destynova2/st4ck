apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: storage
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
    createNamespace: false
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: zot
      version: "${zot_version}"
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: zot-values
      valuesKey: values.yaml
