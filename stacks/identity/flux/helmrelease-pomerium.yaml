apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pomerium
  namespace: identity
spec:
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: hydra
  chart:
    spec:
      chart: pomerium
      version: "${pomerium_version}"
      sourceRef:
        kind: HelmRepository
        name: pomerium
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: pomerium-values
      valuesKey: values.yaml
      optional: false
    - kind: Secret
      name: pomerium-secrets
      valuesKey: values.yaml
      optional: false
