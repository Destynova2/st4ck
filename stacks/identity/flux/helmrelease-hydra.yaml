apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hydra
  namespace: identity
spec:
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: kratos
  chart:
    spec:
      chart: hydra
      version: "${hydra_version}"
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: hydra-values
      valuesKey: values.yaml
      optional: false
    - kind: Secret
      name: hydra-secrets
      valuesKey: values.yaml
      optional: false
