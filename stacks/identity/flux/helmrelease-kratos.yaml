apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos
  namespace: identity
spec:
  interval: 30m
  # Failed upgrades: retry 3x then roll back (hardening 2026-07-12)
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: kratos
      version: "${kratos_version}"
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: kratos-values
      valuesKey: values.yaml
      optional: false
    # DSN injected separately — values-kratos.yaml has no ${dsn}
    # placeholder anymore (Flux can't templatefile). The Secret is
    # composed by ExternalSecret kratos-secrets from CNPG identity-pg-app.
    - kind: Secret
      name: kratos-secrets
      valuesKey: values.yaml
      optional: false
