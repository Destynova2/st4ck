apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup-reader
  namespace: identity
automountServiceAccountToken: false
---
# Read exactly one source Secret; no access to zot or Velero credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-backup-reader
  namespace: storage
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cnpg-s3-credentials]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-backup-reader
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-backup-reader
subjects:
  - kind: ServiceAccount
    name: cnpg-backup-reader
    namespace: identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-backup-reader-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-backup-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-backup-reader-review
subjects:
  - kind: ServiceAccount
    name: cnpg-backup-reader
    namespace: identity
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cnpg-backup-source
  namespace: identity
spec:
  provider:
    kubernetes:
      remoteNamespace: storage
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: cnpg-backup-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
  namespace: identity
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: cnpg-backup-source
  target:
    name: cnpg-s3-credentials
  data:
    - secretKey: access_key
      remoteRef: {key: cnpg-s3-credentials, property: access_key}
    - secretKey: secret_key
      remoteRef: {key: cnpg-s3-credentials, property: secret_key}
