when:
  - event: [push, pull_request]
    branch: main

variables:
  - &tofu_image ghcr.io/opentofu/opentofu:1.12.5

steps:
  # ─── Validate (PR + push) — no secrets needed ─────────────────────
  # Validate every module without initializing the remote state backend.
  - name: validate
    image: *tofu_image
    commands:
      - |
        FAIL=0
        tofu fmt -check -recursive stacks envs modules bootstrap || FAIL=1
        for dir in $(find stacks envs modules bootstrap -name '*.tf' -not -path '*/.terraform/*' -not -path '*/examples/*' -exec dirname {} \; | sort -u); do
          echo "--- validating $dir"
          (cd "$dir" && tofu init -backend=false -input=false >/dev/null && tofu validate) || FAIL=1
        done
        exit "$FAIL"

  # ─── Tofu test (pass1 #7 / pass2 #10) — run .tftest.hcl ─────────────
  # Bootstrap, cloud stages, EM bootstrap and PKI use mocked providers.
  # The cluster tests
  # (envs/scaleway/tests/cluster.tftest.hcl) run from envs/scaleway itself.
  - name: test-tftest
    image: *tofu_image
    commands:
      - |
        FAIL=0
        for dir in \
          bootstrap \
          bootstrap/tofu \
          envs/scaleway/iam \
          envs/scaleway/image \
          envs/scaleway/ci \
          envs/scaleway \
          modules/em-talos-bootstrap \
          modules/em-talos-bootstrap/modules/karpenter-config \
          stacks/pki; do
          if [ ! -d "$dir/tests" ] || ! ls "$dir"/tests/*.tftest.hcl >/dev/null 2>&1; then
            echo "--- skipping $dir (no .tftest.hcl)"
            continue
          fi
          echo "--- tofu test $dir"
          (cd "$dir" && tofu init -backend=false -input=false >/dev/null && tofu test) || FAIL=1
        done
        exit "$FAIL"
    depends_on: [validate]

  - name: test-karpenter
    image: golang:1.26.5
    commands:
      - go version
      - cd karpenter-provider-scaleway
      - test -z "$(gofmt -l cmd pkg)"
      - go test -race ./...
      - go vet ./...
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/controller-amd64 ./cmd/controller
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/controller-arm64 ./cmd/controller

  # Day-2 delivery is reconciled by Flux. Infrastructure uses make scaleway-up.
  - name: prepare-kubeconform
    image: golang:1.26.5
    commands:
      - GOBIN="$PWD/.ci-tools" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

  - name: verify-gitops
    image: alpine/k8s:1.35.4
    commands:
      - apk add --no-cache python3 py3-yaml bash jq make
      - test "$(cat .ci-tools/tofu.arch)" = "$(uname -m)"
      - export PATH="$PWD/.ci-tools:$PATH"
      - tofu version
      - bash scripts/verify-render.sh
      - python3 -m unittest discover -s scripts/tests
      - python3 scripts/flux-review_test.py
    depends_on: [validate, prepare-kubeconform, prepare-tofu]

  # Python template tests need tofu console. Use the pinned multi-arch image,
  # not an unchecked download; fail if jobs unexpectedly change architecture.
  - name: prepare-tofu
    image: *tofu_image
    commands:
      - mkdir -p .ci-tools
      - cp "$(command -v tofu)" .ci-tools/tofu
      - chmod 0755 .ci-tools/tofu
      - uname -m > .ci-tools/tofu.arch
