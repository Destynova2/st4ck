apiVersion: v1
kind: ConfigMap
metadata:
  name: matchbox-profiles
data:
  # Placeholder profile served by the Matchbox sidecar. The real
  # per-tenant profiles are POST'ed by modules/em-talos-matchbox-bootstrap
  # (Terraform) + the Karpenter custom provider (issue #1 Phase B).
  # Kept here so `matchbox -profiles-dir` has a valid JSON on startup.
  talos-placeholder.json: |
    {
      "id": "talos-placeholder",
      "name": "talos-placeholder",
      "boot": {
        "kernel": "/assets/talos/vmlinuz-amd64",
        "initrd": ["/assets/talos/initramfs-amd64.xz"],
        "args": [
          "initrd=initramfs-amd64.xz",
          "talos.platform=metal",
          "talos.config=http://127.0.0.1:8090/generic?mac=$${mac:hexhyp}"
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
data:
  config.hcl: |
    ui            = true
    disable_mlock = true
    api_addr      = "http://127.0.0.1:8200"
    cluster_addr  = "http://127.0.0.1:8201"
    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable     = true
    }
    storage "raft" {
      path    = "/bao/data"
      node_id = "node-0"
    }
    seal "static" {
      current_key_id = "bootstrap-1"
      current_key    = "file:///bao/seal/unseal.key"
    }

    # ─── Self-init: KV v2 for tfstate + cluster secrets ──────────
    initialize "kv" {
      request "mount-kv" {
        operation = "update"
        path      = "sys/mounts/secret"
        data = {
          type    = "kv"
          options = { version = "2" }
        }
      }
    }

    # ─── Self-init: Transit for auto-unseal ──────────────────────
    initialize "transit" {
      request "mount-transit" {
        operation = "update"
        path      = "sys/mounts/transit"
        data      = { type = "transit" }
      }
      request "create-autounseal-key" {
        operation = "update"
        path      = "transit/keys/autounseal"
        data      = { type = "aes256-gcm96" }
      }
    }

    # ─── Self-init: AppRole for vault-backend ───────────────────
    initialize "approle" {
      request "enable-approle" {
        operation = "update"
        path      = "sys/auth/approle"
        data      = { type = "approle" }
      }
      request "create-role" {
        operation = "update"
        path      = "auth/approle/role/vault-backend"
        data = {
          token_policies = ["vault-backend"]
          token_period   = "768h"
        }
      }
    }

    # ─── Self-init: Admin auth (for tofu-setup to create tokens) ─
    initialize "admin" {
      request "add-superuser-policy" {
        operation = "update"
        path      = "sys/policies/acl/superuser"
        data = {
          policy = "path \"*\" { capabilities = [\"create\",\"update\",\"read\",\"delete\",\"list\",\"sudo\"] }"
        }
      }
      request "mount-userpass" {
        operation = "update"
        path      = "sys/auth/userpass"
        data = {
          type = "userpass"
        }
      }
      request "create-admin-user" {
        operation = "update"
        path      = "auth/userpass/users/bootstrap-admin"
        data = {
          "password" = {
            eval_type   = "string"
            eval_source = "env"
            env_var     = "BAO_ADMIN_PASSWORD"
          }
          "token_policies" = ["superuser"]
        }
      }
    }

    # ─── Self-init: Policies ─────────────────────────────────────
    initialize "policies" {
      request "vault-backend-policy" {
        operation = "update"
        path      = "sys/policies/acl/vault-backend"
        data = {
          policy = "path \"secret/data/tfstate/*\" { capabilities = [\"create\",\"read\",\"update\"] }\npath \"secret/metadata/tfstate/*\" { capabilities = [\"delete\",\"read\",\"list\"] }"
        }
      }
      request "cluster-secrets-ro-policy" {
        operation = "update"
        path      = "sys/policies/acl/cluster-secrets-ro"
        data = {
          policy = "path \"secret/data/cluster/*\" { capabilities = [\"read\"] }\npath \"auth/token/create\" { capabilities = [\"create\", \"update\"] }"
        }
      }
      request "autounseal-policy" {
        operation = "update"
        path      = "sys/policies/acl/autounseal"
        data = {
          policy = "path \"transit/encrypt/autounseal\" { capabilities = [\"update\"] }\npath \"transit/decrypt/autounseal\" { capabilities = [\"update\"] }"
        }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: platform
  labels:
    app: platform
spec:
  restartPolicy: Always
  containers:
    # ═══ OpenBao KMS (single Raft node) ══════════════════════════════
    - name: bao
      image: quay.io/openbao/openbao:2.5.1@sha256:87d715029a47328172774638cabfeb04d5b356678d660621b796b6a671f93581
      command: ["bao", "server", "-config=/config/config.hcl"]
      ports:
        - containerPort: 8200
          hostPort: ${p_kms}
        - containerPort: 8201
          hostPort: ${p_kms_cluster}
      env:
        - name: SKIP_CHOWN
          value: "true"
        - name: BAO_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: platform-secrets, key: CI_PASSWORD } }
      volumeMounts:
        - name: openbao-config
          mountPath: /config
          readOnly: true
        - name: bao-data
          mountPath: /bao/data
        - name: bao-seal
          mountPath: /bao/seal
          readOnly: true

    # ═══ vault-backend (TF state HTTP → OpenBao KV v2) ═══════════════
    # No token needed at startup — each TF client sends creds per request.
    - name: vault-backend
      image: ${vault_backend_image}
      ports:
        - containerPort: 8080
          hostPort: ${p_vb}
      env:
        - name: VAULT_URL
          value: "http://127.0.0.1:8200"
        - name: VAULT_STORE
          value: "secret"
        - name: VAULT_PREFIX
          value: "tfstate"
        - name: LISTEN_ADDRESS
          value: "0.0.0.0:8080"

    # ═══ Gitea (rootless, pre-configured via env — no install wizard) ══
    # INSTALL_LOCK=true skips the wizard POST that causes a server
    # shutdown+restart race condition ("address already in use" on :3000).
    # First user registered via /user/sign_up becomes admin automatically.
    - name: gitea
      image: docker.io/gitea/gitea:1.22-rootless@sha256:4216d612992a25ed5fe6062679ca0be0b224f93c0b6fdba03e6c8f3d623cfb4e
      ports:
        - containerPort: 3000
          hostPort: ${p_gitea_http}
        - containerPort: 2222
          hostPort: ${p_gitea_ssh}
      volumeMounts:
        - name: gitea-data
          mountPath: /var/lib/gitea
        - name: gitea-config
          mountPath: /etc/gitea
      env:
        - name: GITEA__security__INSTALL_LOCK
          value: "true"
        - name: GITEA__service__DISABLE_REGISTRATION
          value: "true"
        - name: GITEA__server__ROOT_URL
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_GITEA_URL } }
        - name: GITEA__server__DOMAIN
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_DOMAIN } }
        - name: GITEA__server__HTTP_PORT
          value: "3000"
        - name: GITEA__server__SSH_PORT
          value: "2222"
        - name: GITEA__webhook__ALLOWED_HOST_LIST
          value: "loopback,private"
        - name: GITEA__database__DB_TYPE
          value: "sqlite3"
        - name: GITEA__database__PATH
          value: "/var/lib/gitea/data/gitea.db"

    # ═══ Woodpecker server (v3, reads OAuth creds from files) ═════════
    - name: woodpecker-server
      image: docker.io/woodpeckerci/woodpecker-server:v3@sha256:428eb0965754e25e67b8b086648438858b4fa64487b1cd3cc8e4101b396e459a
      ports:
        - containerPort: 8000
          hostPort: ${p_wp_http}
        - containerPort: 9000
          hostPort: ${p_wp_grpc}
      volumeMounts:
        - name: woodpecker-data
          mountPath: /var/lib/woodpecker
        - name: shared
          mountPath: /shared
          readOnly: true
      env:
        - name: WOODPECKER_HOST
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_WP_HOST } }
        - name: WOODPECKER_EXPERT_WEBHOOK_HOST
          value: "http://127.0.0.1:8000"
        - name: WOODPECKER_OPEN
          value: "false"
        - name: WOODPECKER_ADMIN
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_ADMIN } }
        - name: WOODPECKER_GITEA
          value: "true"
        - name: WOODPECKER_GITEA_URL
          value: "http://platform-gitea:3000"
        - name: WOODPECKER_GITEA_CLIENT_FILE
          value: "/shared/gitea-client"
        - name: WOODPECKER_GITEA_SECRET_FILE
          value: "/shared/gitea-secret"
        - name: WOODPECKER_AGENT_SECRET
          valueFrom: { secretKeyRef: { name: platform-secrets, key: CI_AGENT_SECRET } }
        - name: WOODPECKER_DEV_GITEA_OAUTH_URL
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_OAUTH_URL } }

    # ═══ Woodpecker agent ════════════════════════════════════════════
    - name: woodpecker-agent
      image: docker.io/woodpeckerci/woodpecker-agent:v3@sha256:a983b1016217ad94cdab48d732ec97b5b1f72718725d651183d7ec885f7caf35
      command: ["woodpecker-agent", "agent"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: podman-sock
          mountPath: /var/run/docker.sock
        - name: woodpecker-agent-data
          mountPath: /etc/woodpecker
        - name: shared
          mountPath: /shared
          readOnly: true
      env:
        - name: WOODPECKER_SERVER
          value: "platform-woodpecker-server:9000"
        - name: WOODPECKER_BACKEND
          value: "docker"
        - name: WOODPECKER_AGENT_SECRET
          valueFrom: { secretKeyRef: { name: platform-secrets, key: CI_AGENT_SECRET } }
        - name: WOODPECKER_HEALTHCHECK_ADDR
          value: "127.0.0.1:3001"
        - name: WOODPECKER_BACKEND_DOCKER_NETWORK
          value: "podman-default-kube-network"

    # ═══ Matchbox sidecar (iPXE + profiles HTTP, bound to loopback) ══
    # Shares the pod's network namespace with Gitea/OpenBao so the
    # Karpenter custom provider can POST profiles at 127.0.0.1:8080
    # without exposing Matchbox on the host interface.
    # See modules/em-talos-matchbox-bootstrap/ + issue #1 Phase B.
    - name: matchbox
      image: quay.io/poseidon/matchbox:v0.10.0@sha256:e14cc4a8f6e8f1182fce74d04fe949b6bfc91b04132b3944297661e2c38c9790
      args:
        # Port 8090 (not 8080) — vault-backend already binds 0.0.0.0:8080 in
        # the same netns; shared-pod networking would EADDRINUSE the loser.
        - -address=127.0.0.1:8090
        - -log-level=debug
        - -data-path=/var/lib/matchbox
        - -assets-path=/var/lib/matchbox/assets
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      livenessProbe:
        # Podman's httpGet translation requires curl, absent from this image.
        exec:
          command: ["wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8090/"]
        timeoutSeconds: 5
        initialDelaySeconds: 5
        periodSeconds: 30
      volumeMounts:
        - name: matchbox-data
          mountPath: /var/lib/matchbox
        - name: matchbox-profiles
          mountPath: /var/lib/matchbox/profiles
          readOnly: true
        - name: matchbox-assets
          mountPath: /var/lib/matchbox/assets
          readOnly: true

    # ═══ Setup (OpenTofu: tokens, secrets, Gitea, WP) ════════════════
    - name: tofu-setup
      image: ghcr.io/opentofu/opentofu:1.9@sha256:2fc03a4a0e745558a0693f1e80ffe56c3c43826ee21140c4d27f52fd938b82fe
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          echo "[setup] Waiting for OpenBao..."
          until wget -qS http://127.0.0.1:8200/v1/sys/health 2>&1 | grep -q 'HTTP/1.1 200'; do sleep 2; done
          echo "[setup] OpenBao ready"

          # Refuse to regenerate an existing PKI after loss of its setup state.
          cd /var/lib/tofu
          if [ ! -s terraform.tfstate ] && [ -s /kms-output/root-ca.pem ]; then
            echo "[setup] ERROR: existing PKI without setup state; restore the state before continuing" >&2
            exit 1
          fi
          # Configuration is replaceable; state and provider locks are not.
          for config in ./*.tf ./*.tf.json; do
            if [ -f "$config" ]; then rm -- "$config"; fi
          done
          cp /source/bootstrap/tofu/*.tf .
          export TF_VAR_bao_admin_password="$CI_PASSWORD"
          export TF_VAR_ci_admin="$CI_ADMIN" TF_VAR_ci_password="$CI_PASSWORD"
          export TF_VAR_gitea_external_url="$CI_GITEA_URL"
          export TF_VAR_wp_external_url="$CI_WP_HOST"
          export TF_VAR_gitea_internal_url=http://127.0.0.1:3000
          export TF_VAR_wp_internal_url=http://127.0.0.1:8000

          tofu init -input=false

          # Phase 1: vault tokens + PKI + Gitea install (no gitea provider)
          tofu apply -auto-approve -input=false \
            -target=vault_token.vault_backend \
            -target=vault_token.autounseal \
            -target=tls_self_signed_cert.root_ca \
            -target=tls_locally_signed_cert.infra_ca \
            -target=tls_locally_signed_cert.app_ca \
            -target=terraform_data.gitea_install

          # Phase 2: gitea provider + WP (Gitea is now installed)
          tofu apply -auto-approve -input=false

          echo "[setup] === Platform ready ==="
          exec sleep infinity
      volumeMounts:
        - name: shared
          mountPath: /shared
        - name: source
          mountPath: /source
          readOnly: true
        - name: kms-output
          mountPath: /kms-output
        - name: tofu-state
          mountPath: /var/lib/tofu
      env:
        - name: CI_ADMIN
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_ADMIN } }
        - name: CI_PASSWORD
          valueFrom: { secretKeyRef: { name: platform-secrets, key: CI_PASSWORD } }
        - name: CI_WP_HOST
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_WP_HOST } }
        - name: CI_GITEA_URL
          valueFrom: { configMapKeyRef: { name: platform-config, key: CI_GITEA_URL } }
        - name: CI_AGENT_SECRET
          valueFrom: { secretKeyRef: { name: platform-secrets, key: CI_AGENT_SECRET } }

  volumes:
    - name: openbao-config
      configMap: { name: openbao-config }
    - name: bao-data
      persistentVolumeClaim: { claimName: platform-bao-data }
    - name: bao-seal
      configMap: { name: bao-seal-key }
    - name: gitea-data
      persistentVolumeClaim: { claimName: platform-gitea-data }
    - name: gitea-config
      persistentVolumeClaim: { claimName: platform-gitea-config }
    - name: woodpecker-data
      persistentVolumeClaim: { claimName: platform-wp-data }
    - name: woodpecker-agent-data
      persistentVolumeClaim: { claimName: platform-wp-agent-data }
    - name: podman-sock
      hostPath: { path: "${podman_socket_path}", type: Socket }
    - name: shared
      persistentVolumeClaim: { claimName: platform-shared }
    - name: source
      hostPath: { path: "${source_dir}", type: Directory }
    - name: kms-output
      persistentVolumeClaim: { claimName: platform-kms-output }
    - name: tofu-state
      persistentVolumeClaim: { claimName: platform-tofu-state }
    - name: matchbox-data
      emptyDir: {}
    - name: matchbox-profiles
      configMap: { name: matchbox-profiles }
    - name: matchbox-assets
      persistentVolumeClaim: { claimName: platform-matchbox-assets }
