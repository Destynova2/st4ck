apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalewayemnodeclasses.karpenter.scaleway.st4ck.io
spec:
  group: karpenter.scaleway.st4ck.io
  names:
    kind: ScalewayEMNodeClass
    listKind: ScalewayEMNodeClassList
    plural: scalewayemnodeclasses
    singular: scalewayemnodeclass
    categories:
      - karpenter
    shortNames:
      - scwemnc
      - scwemncs
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Zone
          type: string
          jsonPath: .spec.zone
        - name: Offer
          type: string
          jsonPath: .spec.offerName
        - name: Pool
          type: integer
          jsonPath: .status.poolSize
        - name: Available
          type: integer
          jsonPath: .status.available
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          description: >-
            ScalewayEMNodeClass describes a static pool of pre-imaged Scaleway
            Elastic Metal servers that Karpenter powers on (provision) and off
            (deprovision).
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - zone
                - poolTag
                - offerName
              properties:
                zone:
                  description: Scaleway zone hosting the pool servers (e.g. fr-par-2).
                  type: string
                  minLength: 1
                poolTag:
                  description: >-
                    Exact server tag selecting pool members, e.g.
                    "st4ck.io/karpenter-pool=metal".
                  type: string
                  minLength: 1
                offerName:
                  description: >-
                    Elastic Metal commercial offer of the pool servers (e.g.
                    EM-A116X-SSD); names the instance type exposed to the
                    scheduler.
                  type: string
                  minLength: 1
            status:
              type: object
              properties:
                conditions:
                  description: Conditions contains signals for health and readiness.
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                poolSize:
                  description: Number of servers carrying the pool tag.
                  type: integer
                  format: int32
                available:
                  description: Number of stopped servers, i.e. startable capacity.
                  type: integer
                  format: int32
