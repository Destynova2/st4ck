  names:
    kind: ScalewayVMNodeClass
    listKind: ScalewayVMNodeClassList
    plural: scalewayvmnodeclasses
    singular: scalewayvmnodeclass
    categories: [karpenter]
  scope: Cluster
  versions:
    - name: v1alpha1
